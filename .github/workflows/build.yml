name: Build

# Baut WipeKit für macOS, Windows und Linux.
# - Bei jedem Push: Probe-Build, Dateien unter »Actions« als Artefakte herunterladbar
# - Beim Veröffentlichen eines Releases: Dateien werden automatisch an das Release angehängt

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version bestimmen
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then V="${{ github.event.release.tag_name }}"; elif [ "${{ github.ref_type }}" = "tag" ]; then V="${{ github.ref_name }}"; else V="0.0.0-dev"; fi
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"

      - name: "App bauen (Universal – Intel + Apple Silicon, inkl. smartctl)"
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash macos/build.sh

      - name: App-Paket prüfen
        run: |
          APP=macos/build/WipeKit.app
          lipo -archs "$APP/Contents/MacOS/WipeKit"
          lipo -archs "$APP/Contents/MacOS/smartctl"
          "$APP/Contents/MacOS/smartctl" --version | head -2
          # USB-Direktzugriff (WipeKit-Ergänzung) ist eingebaut: unbekanntes Gerät -> klare Meldung
          OUT=$("$APP/Contents/MacOS/smartctl" -i -j usbcap:0x7fffffff || true)
          echo "$OUT" | head -20
          echo "$OUT" | grep -q "USB drive not found"
          ls "$APP/Contents/Resources" "$APP/Contents/Resources/Lizenzen"
          codesign --verify --deep --strict "$APP" && echo "Signatur in Ordnung"

      - name: Diagnose testen (echte Laufwerke des Testrechners)
        run: |
          for d in $(diskutil list -plist physical | plutil -extract WholeDisks json -o - - | python3 -c "import json,sys;print(' '.join(json.load(sys.stdin)))"); do
            macos/build/WipeKit.app/Contents/MacOS/smartctl -x -j "/dev/$d" > "$RUNNER_TEMP/$d.json" || true
            python3 - "$RUNNER_TEMP/$d.json" "$d" <<'PY'
          import sys
          sys.path.insert(0, "linux/wipekit")
          import health
          h = health.parse_text(open(sys.argv[1]).read())
          print(sys.argv[2], "->", h.rating, "|", h.model or "-", "|", h.reason or "; ".join(h.reasons))
          PY
          done

      - name: Oberfläche prüfen (Beispieldaten, Bildschirmfotos, Berichte)
        env:
          WIPEKIT_SHOTS: ${{ github.workspace }}/screenshots
          WIPEKIT_REPORTS: ${{ github.workspace }}/screenshots/berichte
          WIPEKIT_FIXTURES: ${{ github.workspace }}/tests/fixtures
        run: |
          macos/build/WipeKit.app/Contents/MacOS/WipeKit --smoke-test
          ls -la screenshots screenshots/berichte/PDF

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Screenshots-macOS
          path: screenshots/
          if-no-files-found: ignore

      - name: Echtes Löschen und Prüfen testen (eingehängtes Disk-Image, als root)
        run: |
          hdiutil create -size 48m -fs HFS+ -volname WKTEST -o "$RUNNER_TEMP/wk.dmg"
          DEV=$(hdiutil attach "$RUNNER_TEMP/wk.dmg" | head -1 | awk '{print $1}' | sed 's#/dev/##')
          echo "Disk-Image: $DEV"; diskutil list "$DEV"
          BASE="/private/tmp/WipeKit-$(id -u)"; mkdir -p "$BASE"; chmod 700 "$BASE"
          run() {
            JOB="$BASE/ci-$1"; mkdir -p "$JOB"; chmod 700 "$JOB"
            sudo macos/build/WipeKit.app/Contents/MacOS/WipeKit --wipe-helper --disk "$DEV" --mode "$1" --job-dir "$JOB" --allow-disk-image
            STATE=none
            for i in $(seq 1 90); do
              STATE=$(python3 -c "import json;print(json.load(open('$JOB/status.json'))['state'])" 2>/dev/null || echo none)
              case "$STATE" in done|failed|cancelled) break;; esac
              sleep 2
            done
            echo "--- $1: status.json"; cat "$JOB/status.json" || true
            echo; echo "--- helper.log"; cat "$JOB/helper.log" || true
            python3 -c "import json,sys; s=json.load(open('$JOB/status.json')); sys.exit(0 if s['state']=='done' and s.get('verified') else 1)"
          }
          run ssd
          run quick
          run secure
          run check
          echo "--- --usb-health (kein USB-Laufwerk -> normales Lesen)"
          sudo macos/build/WipeKit.app/Contents/MacOS/WipeKit --usb-health "$DEV" | head -c 400; echo
          hdiutil detach "/dev/$DEV" -force || true

      - name: Bildschirmfotos ins Protokoll schreiben
        if: contains(github.event.head_commit.message, '[screenshots]')
        run: |
          for f in screenshots/*.png; do
            sips -Z 1300 -s format jpeg -s formatOptions 82 "$f" --out "$RUNNER_TEMP/s.jpg" >/dev/null
            echo "===BEGIN $(basename "$f" .png).jpg==="; base64 -b 120 -i "$RUNNER_TEMP/s.jpg"; echo "===END==="
          done
          f=$(ls screenshots/berichte/PDF/*ausfuehrlich*.pdf | head -1)
          echo "===BEGIN macos-bericht.pdf==="; base64 -b 120 -i "$f"; echo "===END==="

      - name: ZIP und Quelltext von smartmontools bereitstellen
        run: |
          mkdir -p dist
          ditto -c -k --keepParent macos/build/WipeKit.app "dist/WipeKit-macOS-${VERSION}.zip"
          cp macos/vendor/smartmontools-7.5.tar.gz macos/vendor/smartmontools-7.5-wipekit.tar.gz dist/

      - name: Update signieren
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then echo "Kein Signaturschlüssel (Secret UPDATE_SIGNING_KEY) – übersprungen."; exit 0; fi
          umask 077; printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/k.pem"
          openssl ec -in "$RUNNER_TEMP/k.pem" -pubout -out "$RUNNER_TEMP/pub.pem" 2>/dev/null
          for f in dist/WipeKit-macOS-*.zip; do
            openssl dgst -sha256 -sign "$RUNNER_TEMP/k.pem" -out "$f.sig" "$f"
            openssl dgst -sha256 -verify "$RUNNER_TEMP/pub.pem" -signature "$f.sig" "$f"
          done
          rm -f "$RUNNER_TEMP/k.pem"

      - uses: actions/upload-artifact@v7
        with:
          name: WipeKit-macOS
          path: dist/*

      - name: An Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version bestimmen
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then V="${{ github.event.release.tag_name }}"; V="${V#v}"; elif [ "${{ github.ref_type }}" = "tag" ]; then V="${{ github.ref_name }}"; V="${V#v}"; else V="0.0.0"; fi
          echo "VERSION=${V}" >> "$GITHUB_ENV"

      - name: smartctl (smartmontools 7.5) laden und prüfen
        shell: pwsh
        run: |
          $url = "https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-7.5.win32-setup.exe"
          New-Item -ItemType Directory -Force -Path windows\vendor, "$env:RUNNER_TEMP\sm" | Out-Null
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\sm-setup.exe"
          Invoke-WebRequest "$url.md5" -OutFile "$env:RUNNER_TEMP\sm-setup.md5"
          $want = ((Get-Content "$env:RUNNER_TEMP\sm-setup.md5" -Raw) -split '\s+')[0].ToLower()
          $have = (Get-FileHash "$env:RUNNER_TEMP\sm-setup.exe" -Algorithm MD5).Hash.ToLower()
          if ($want -ne $have) { throw "Prüfsumme stimmt nicht ($want / $have)" }
          Write-Host "MD5 in Ordnung: $have · SHA-256: $((Get-FileHash "$env:RUNNER_TEMP\sm-setup.exe").Hash)"
          & 7z x "$env:RUNNER_TEMP\sm-setup.exe" "-o$env:RUNNER_TEMP\sm" -y | Out-Null
          $found = $null
          foreach ($f in Get-ChildItem "$env:RUNNER_TEMP\sm" -Recurse -Filter smartctl.exe) {
            $b = [IO.File]::ReadAllBytes($f.FullName)
            $pe = [BitConverter]::ToInt32($b, 0x3C)
            $machine = [BitConverter]::ToUInt16($b, $pe + 4)
            Write-Host "$($f.FullName): Maschine 0x$('{0:X}' -f $machine)"
            if ($machine -eq 0x8664) { $found = $f.FullName }
          }
          if (-not $found) { throw "64-Bit-smartctl.exe nicht gefunden" }
          Copy-Item $found windows\vendor\smartctl.exe
          & windows\vendor\smartctl.exe --version | Select-Object -First 2

      - name: Portable EXE bauen
        shell: bash
        run: >
          dotnet publish windows/WipeKit.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -p:Version=${VERSION} -o dist/win

      - name: Lösch-Logik prüfen (mit Testdatei)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\win\WipeKit.exe -ArgumentList '--engine-test', "$env:RUNNER_TEMP\wipetest.bin" -Wait -PassThru
          if (Test-Path "$env:RUNNER_TEMP\wipetest.bin.log") { Get-Content "$env:RUNNER_TEMP\wipetest.bin.log" }
          if ($p.ExitCode -ne 0) { throw "Engine-Test fehlgeschlagen (Code $($p.ExitCode))" }

      - name: Diagnose testen (smartctl, echte Laufwerke des Testrechners)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\win\WipeKit.exe -ArgumentList '--health-test' -Wait -PassThru
          $log = Join-Path $env:TEMP 'WipeKit-HealthTest.log'
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Diagnose-Test fehlgeschlagen (Code $($p.ExitCode))" }

      - name: Oberfläche prüfen
        shell: pwsh
        run: |
          $env:WIPEKIT_FIXTURES = "$PWD\tests\fixtures"
          $env:WIPEKIT_REPORTS = "$PWD\screenshots\berichte"
          $env:WIPEKIT_SHOTS = "$PWD\screenshots"
          $p = Start-Process -FilePath dist\win\WipeKit.exe -ArgumentList '--smoke-test' -Wait -PassThru
          $log = Join-Path $env:TEMP 'WipeKit-Smoke.log'
          if (Test-Path $log) { Get-Content $log }
          $err = Join-Path $env:TEMP 'WipeKit-Fehler.log'
          if (Test-Path $err) { Get-Content $err }
          if ($p.ExitCode -ne 0) { throw "Oberflächen-Test fehlgeschlagen (Code $($p.ExitCode))" }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Screenshots-Windows
          path: screenshots/
          if-no-files-found: ignore

      - name: Bildschirmfotos ins Protokoll schreiben
        if: contains(github.event.head_commit.message, '[screenshots]')
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters(1)
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality, [long]82)
          foreach ($f in Get-ChildItem screenshots -Filter *.png) {
            $img = [System.Drawing.Image]::FromFile($f.FullName)
            $scale = [Math]::Min(1.0, 1300.0 / $img.Width)
            $bmp = New-Object System.Drawing.Bitmap([int]($img.Width * $scale), [int]($img.Height * $scale))
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = 'HighQualityBicubic'
            $g.DrawImage($img, 0, 0, $bmp.Width, $bmp.Height)
            $out = Join-Path $env:RUNNER_TEMP ($f.BaseName + '.jpg')
            $bmp.Save($out, $codec, $ep)
            $g.Dispose(); $bmp.Dispose(); $img.Dispose()
            Write-Output "===BEGIN $($f.BaseName).jpg==="
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($out))
            for ($i = 0; $i -lt $b64.Length; $i += 120) { Write-Output $b64.Substring($i, [Math]::Min(120, $b64.Length - $i)) }
            Write-Output "===END==="
          }
          $pdf = Get-ChildItem screenshots\berichte\PDF -Filter *ausfuehrlich*.pdf | Select-Object -First 1
          Write-Output "===BEGIN windows-bericht.pdf==="
          $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pdf.FullName))
          for ($i = 0; $i -lt $b64.Length; $i += 120) { Write-Output $b64.Substring($i, [Math]::Min(120, $b64.Length - $i)) }
          Write-Output "===END==="

      - name: Echtes Löschen testen (virtuelle Festplatte mit eingehängtem NTFS-Laufwerk)
        shell: pwsh
        run: |
          $vhd = "$env:RUNNER_TEMP\wk.vhdx"
          $script = @"
          create vdisk file="$vhd" maximum=64 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          convert gpt
          create partition primary
          format fs=ntfs quick label=WKTEST
          assign letter=W
          "@
          Set-Content -Path "$env:RUNNER_TEMP\dp.txt" -Value $script -Encoding ascii
          diskpart /s "$env:RUNNER_TEMP\dp.txt"
          Set-Content -Path W:\test.txt -Value 'Testdaten'
          $num = (Get-DiskImage -ImagePath $vhd | Get-Disk).Number
          Write-Host "Testdatenträger: $num"
          $log = Join-Path $env:TEMP 'WipeKit-DiskTest.log'
          foreach ($mode in 'secure', 'quick', 'ssd', 'maximum', 'check') {
            $p = Start-Process -FilePath dist\win\WipeKit.exe -ArgumentList '--disk-test', $num, $mode -Wait -PassThru
            if ($p.ExitCode -ne 0) { if (Test-Path $log) { Get-Content $log }; throw "Test $mode fehlgeschlagen (Code $($p.ExitCode))" }
          }
          if (Test-Path $log) { Get-Content $log }

      - name: Installer bauen
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:VERSION" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup fehlgeschlagen" }

      - name: Dateien benennen
        shell: bash
        run: |
          cp dist/win/WipeKit.exe "dist/WipeKit-Windows-Portable-${VERSION}.exe"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: WipeKit-Windows
          path: |
            dist/WipeKit-Windows-Portable-*.exe
            dist/WipeKit-Windows-Setup-*.exe

      - name: An Release anhängen
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/WipeKit-Windows-Portable-*.exe dist/WipeKit-Windows-Setup-*.exe --clobber

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version bestimmen
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then V="${{ github.event.release.tag_name }}"; V="${V#v}"; elif [ "${{ github.ref_type }}" = "tag" ]; then V="${{ github.ref_name }}"; V="${V#v}"; else V="0.0.0"; fi
          echo "VERSION=${V}" >> "$GITHUB_ENV"

      - name: Abhängigkeiten für den Test installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            adwaita-icon-theme librsvg2-common xvfb dbus-x11 smartmontools hdparm nvme-cli qpdf poppler-utils

      - name: Python-Code prüfen
        run: |
          for f in linux/wipekit/*.py linux/wipekit/wipekit-helper linux/wipekit/wipekit-diag; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"
          done
          python3 tests/test_core.py

      - name: Oberfläche prüfen
        env:
          WIPEKIT_SHOTS: ${{ github.workspace }}/screenshots
          WIPEKIT_REPORTS: ${{ github.workspace }}/screenshots/berichte
        run: xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- python3 linux/wipekit/wipekit_gui.py --smoke-test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Screenshots-Linux
          path: screenshots/
          if-no-files-found: ignore

      - name: Diagnose testen (S.M.A.R.T. aller Laufwerke lesen, als root)
        run: |
          sudo python3 linux/wipekit/wipekit-diag > "$RUNNER_TEMP/diag.json"
          python3 - "$RUNNER_TEMP/diag.json" <<'PY'
          import json, sys
          sys.path.insert(0, "linux/wipekit")
          import health
          data = json.load(open(sys.argv[1]))
          for name, e in data["disks"].items():
              h = health.parse(e["smart"])
              print(name, "->", h.rating, "|", h.model or "-", "|", h.reason or "; ".join(h.reasons))
          PY

      - name: Echtes Löschen und Prüfen testen (Loop-Gerät, als root)
        run: |
          truncate -s 64M "$RUNNER_TEMP/wk.img"
          LOOP=$(sudo losetup --show -f "$RUNNER_TEMP/wk.img")
          sudo mkfs.ext4 -q "$LOOP"
          sudo mkdir -p /mnt/wktest && sudo mount "$LOOP" /mnt/wktest
          echo "Testdaten" | sudo tee /mnt/wktest/test.txt > /dev/null
          BASE="/tmp/wipekit-$(id -u)"; mkdir -p "$BASE"; chmod 700 "$BASE"
          run() {  # Modus, erwartetes Feld
            JOB="$BASE/ci-$1"; mkdir -p "$JOB"; chmod 700 "$JOB"
            sudo python3 linux/wipekit/wipekit-helper --disk "$(basename "$LOOP")" --mode "$1" --job-dir "$JOB" --allow-loop || true
            echo "--- $1:"; cat "$JOB/status.json"; echo
            python3 -c "import json,sys; s=json.load(open('$JOB/status.json')); sys.exit(0 if s['state']=='done' and s['verified'] else 1)"
          }
          run ssd
          run quick
          run secure
          run check          # nach »Sicher« muss das Laufwerk leer sein
          sudo losetup -d "$LOOP" || true

      - name: Pakete bauen
        run: bash linux/build.sh "$VERSION"

      - name: Paket prüfen
        run: |
          dpkg-deb -c dist/*.deb | grep -E "wipekit-diag|health.py|reports.py|report-logo.jpg|THIRD-PARTY"
          dpkg-deb -f dist/*.deb Depends

      - uses: actions/upload-artifact@v7
        with:
          name: WipeKit-Linux
          path: dist/*

      - name: An Release anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  # Beim Hochladen eines Versions-Tags (z. B. v1.1.1): Release mit allen Dateien automatisch anlegen
  release:
    name: Release veröffentlichen
    if: github.ref_type == 'tag' && github.event_name == 'push'
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: WipeKit-*
          merge-multiple: true

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="docs/release-notes/$TAG.md"
          [ -f "$NOTES" ] || { echo "WipeKit $TAG" > "$RUNNER_TEMP/notes.md"; NOTES="$RUNNER_TEMP/notes.md"; }
          ls -la release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "WipeKit ${TAG#v}" --notes-file "$NOTES" --latest
          fi
